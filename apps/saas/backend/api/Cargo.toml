[package]
name = "sparktest-saas-api"
version = "0.1.0"
edition = "2021"
description = "API server for SparkTest SaaS"
license = "MIT"

[dependencies]
sparktest-saas-core = { path = "../core" }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
stripe = { version = "0.41.0", features = ["checkout", "billing", "runtime-tokio-hyper"], package = "async-stripe" }

[dev-dependencies]
tokio-test = "0.4"
tower = "0.4"
hyper = "1.0"
http-body-util = "0.1"
