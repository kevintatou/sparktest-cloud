[package]
name = "sparktest-saas-core"
version = "0.1.0"
edition = "2021"
description = "Core types and database models for SparkTest SaaS"
license = "MIT"

[dependencies]
core = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"