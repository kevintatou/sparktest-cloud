[package]
name = "sparktest-agent"
version = "0.1.1"
edition = "2021"
description = "Minimal SparkTest Cloud agent"
license = "MIT"

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.11", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
