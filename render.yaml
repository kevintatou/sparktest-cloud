services:
  - type: web
    name: sparktest-cloud-api
    runtime: rust
    plan: starter
    buildCommand: cargo build --release -p sparktest-saas-bin
    startCommand: ./target/release/sparktest-saas-server
    healthCheckPath: /api/health
    envVars:
      - key: RUST_LOG
        value: info
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
