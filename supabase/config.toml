project_id = "sparktest-cloud"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[auth]
enabled = true
site_url = "https://dev.sparktest.dev"
additional_redirect_urls = [
  "https://dev.sparktest.dev",
  "https://dev.sparktest.dev/reset-password",
  "http://localhost:3000",
  "http://localhost:3000/reset-password",
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/reset-password",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = false
