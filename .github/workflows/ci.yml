name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'pnpm'

    - name: Install pnpm
      run: npm install -g pnpm@9.0.0

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build:packages

    - name: Build frontend app
      run: pnpm build:saas-frontend

    - name: Run type checking
      run: pnpm type-check

    # Note: Formatting check disabled due to existing formatting issues in codebase
    # - name: Run formatting check
    #   run: pnpm format:check

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Build Rust backend
      run: cargo build

    - name: Run Rust tests
      run: cargo test