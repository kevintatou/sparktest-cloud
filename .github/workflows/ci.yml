name: CI - Build, Lint & Test

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - ".github/workflows/ci.yml"

jobs:
  frontend:
    name: Frontend - Build & Lint
    runs-on: spark-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Check code formatting
        run: pnpm format:check || echo "Format check skipped"

      - name: Run linting
        run: pnpm lint || echo "Lint check skipped"

      - name: Type check
        run: pnpm type-check || echo "Type check skipped"

      - name: Build workspace packages
        run: pnpm build:packages || echo "Package build skipped"

      - name: Build frontend
        run: pnpm run build:frontend

  backend:
    name: Backend - Build & Test
    runs-on: spark-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --check --verbose --all

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

      - name: Build backend
        run: cargo build --release

  integration:
    name: Integration Tests
    runs-on: spark-runner
    needs: [frontend, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build:packages || echo "Package build skipped"

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Build backend
        run: cargo build

      - name: Run integration tests
        run: cargo test --test integration_tests

      - name: Test health endpoint (mock)
        run: echo "✅ Integration tests would run here"