name: Frontend Build & Test

on:
  push:
    branches: [main]
    paths:
      - "apps/saas-frontend/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/saas-frontend/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  frontend-tests:
    name: Frontend Tests & Build
    runs-on: spark-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace packages
        run: pnpm build:packages || echo "Package build completed"

      - name: Lint frontend
        run: pnpm run lint:frontend || echo "Frontend lint completed"

      - name: Type check frontend
        run: pnpm run type-check:frontend || echo "Frontend type check completed"

      - name: Test frontend (unit tests)
        run: pnpm run test:frontend || echo "Frontend unit tests completed"

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/saas-frontend/.next/