name: Rust Format Check

on:
  push:
    branches: [main]
    paths: ["apps/saas-backend/**", "Cargo.toml"]
  pull_request:
    branches: [main]
    paths: ["apps/saas-backend/**", "Cargo.toml"]

jobs:
  rust-format:
    runs-on: spark-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check --verbose --all

      - name: Run Clippy for additional checks
        run: cargo clippy --all-targets --all-features -- -D warnings